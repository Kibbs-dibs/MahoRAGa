name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test-and-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest -p no:cacheprovider -q

      - name: Continuous evaluation quality gate (Feature 8.2)
        # Runs the Ragas-style benchmark offline (deterministic fallback) and
        # fails the build if avg_composite_score regresses below the floor.
        run: python -m evaluation.ci_gate --min 50
