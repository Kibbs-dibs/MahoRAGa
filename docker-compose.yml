version: '3.8'

services:
  # ── 1. Neo4j Knowledge Graph ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20-community
    container_name: aletheia-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt Protocol
    environment:
      # Credentials come from the environment / .env (NEO4J_USERNAME, NEO4J_PASSWORD).
      # Compose substitutes ${VAR} at deploy time; no secret is committed here.
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in your .env}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── 2. Project Aletheia Web Application ────────────────────────────────────
  aletheia-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aletheia-web
    ports:
      - "7860:7860"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?set NEO4J_PASSWORD in your .env}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b
      # Container publishes 7860; bind 0.0.0.0 INSIDE the container is required
      # so the published port works. Protect writes with ALETHEIA_API_KEY.
      - WEB_UI_HOST=0.0.0.0
      - WEB_UI_PORT=7860
      - ALETHEIA_API_KEY=${ALETHEIA_API_KEY:?set ALETHEIA_API_KEY in your .env}
      - EXPOSE_API_DOCS=${EXPOSE_API_DOCS:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./RAGxamples:/app/RAGxamples
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
